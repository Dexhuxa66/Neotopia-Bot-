<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha Resolver</title>
<style>
:root { color-scheme: dark; }
body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; max-width: 560px; margin: 0 auto; }
h1 { font-size: 18px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; margin-left: 8px; vertical-align: middle; }
.chip.on { background: #1f6feb33; color: #58a6ff; }
.chip.off { background: #23863633; color: #3fb950; }
.box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 16px; }
label { font-size: 12px; color: #8b949e; display: block; margin: 10px 0 4px; }
input { width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 8px; border-radius: 6px; }
button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; margin-top: 14px; font-size: 14px; cursor: pointer; }
button:disabled { background: #30363d; cursor: default; }
#hcaptcha { margin: 14px 0; }
.out { font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.ok { color: #3fb950; }
.err { color: #f85149; }
</style>
</head>
<body>
<h1>hCaptcha Resolver <span id="flag" class="chip off">idle</span></h1>

<div class="box">
  <label>Bot ID</label>
  <input id="botId" value="default">
</div>

<div class="box">
  <label>Status challenge</label>
  <div id="status" class="out">memuat…</div>
</div>

<div class="box">
  <div id="hcaptcha"></div>
  <button id="solve" disabled>Waktu muncul: reload / refresh challenge</button>
  <button id="inject" disabled>Inject token ke bot</button>
</div>

<div class="box">
  <label>Hasil</label>
  <div id="result" class="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let challenge = null;
let solvedToken = null;
let hcaptchaLib = null;
let widgetRendering = false;

function setFlag(on, text) {
  const f = $('flag');
  f.className = "chip " + (on ? "on" : "off");
  f.textContent = text || (on ? "captcha aktif" : "idle");
}

function loadHcaptchaLib() {
  return new Promise((resolve, reject) => {
    if (typeof window.hcaptcha === "object" && window.hcaptcha && window.hcaptcha.render) {
      hcaptchaLib = window.hcaptcha;
      resolve(hcaptchaLib);
      return;
    }
    if (document.querySelector('script[data-hcaptcha]')) {
      hcaptchaLib = window.hcaptcha;
      resolve(hcaptchaLib);
      return;
    }
    const s = document.createElement("script");
    s.src = "https://js.hcaptcha.com/1/api.js?render=explicit";
    s.async = true;
    s.dataset.hcaptcha = "1";
    s.onload = () => { hcaptchaLib = window.hcaptcha; resolve(hcaptchaLib); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function refresh() {
  const botId = $('botId').value.trim() || "default";
  try {
    const res = await fetch("/captcha/" + encodeURIComponent(botId));
    const data = await res.json();
    if (data.active && data.challenge) {
      const prevId = challenge ? challenge.challengeId : null;
      challenge = data.challenge;
      setFlag(true);
      // Re-render widget ONLY when the server actually rotates the
      // challengeId. First load (prevId null) → render once; subsequent
      // polls with same challengeId → skip (widget already mounted).
      // The old hCaptcha token is bound to the old challenge and cannot
      // be reused, so a rotated challengeId forces a fresh solve.
      if (prevId && prevId !== challenge.challengeId) {
        // challengeId rotated → reset previous solve
        solvedToken = null;
        $('inject').disabled = true;
        renderWidget(challenge);
      } else if (!prevId && !widgetRendering) {
        // first time we see an active challenge → mount widget
        renderWidget(challenge);
      }
      $('status').textContent =
        "provider: " + challenge.provider +
        "\nchallengeId: " + challenge.challengeId +
        "\naction: " + challenge.action +
        "\nattempts: " + (challenge.attempts ?? "-") +
        "\nexpires in: " + (challenge.durationMs ? Math.round(challenge.durationMs/1000) + "s" : "-");
    } else {
      challenge = null;
      solvedToken = null;
      setFlag(false);
      $('status').textContent = "Tidak ada challenge aktif.";
      $('hcaptcha').innerHTML = "";
      $('inject').disabled = true;
      widgetRendering = false;
    }
  } catch (err) {
    $('status').textContent = "Gagal load: " + err;
  }
}

async function renderWidget(ch) {
  widgetRendering = true;
  try {
    if (!ch.siteKey) {
      $('hcaptcha').innerHTML = '<span class="err">siteKey kosong — tidak bisa render widget.</span>';
      widgetRendering = false;
      return;
    }
    const lib = await loadHcaptchaLib();
    if (!lib || !lib.render) {
      $('hcaptcha').innerHTML = '<span class="err">Gagal load hCaptcha library (network / CSP). Buka devtools dan reload.</span>';
      widgetRendering = false;
      return;
    }
    const mount = "hcaptcha_" + Date.now();
    $('hcaptcha').innerHTML = '<div id="' + mount + '"></div>';
    await lib.render(mount, {
      sitekey: ch.siteKey,
      cdata: ch.cData || ch.challengeId,
      callback: (response) => {
        solvedToken = response;
        $('result').textContent = "Solved. Token siap di-inject:\n" + response.slice(0, 40) + "…";
        $('result').className = "out ok";
        $('inject').disabled = false;
      },
      "expired-callback": () => {
        $('result').textContent = "Token expired — solve ulang.";
        $('result').className = "out err";
      },
    });
    widgetRendering = false;
  } catch (err) {
    $('hcaptcha').innerHTML = '<span class="err">' + err + '</span>';
    widgetRendering = false;
  }
}

$('solve').onclick = () => {
  if (!challenge) return;
  refresh();
};

$('inject').onclick = async () => {
  if (!solvedToken || !challenge) return;
  const botId = $('botId').value.trim() || "default";
  $('inject').disabled = true;
  try {
    const res = await fetch("/captcha/" + encodeURIComponent(botId) + "/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        challengeId: challenge.challengeId,
        cData: challenge.cData || challenge.challengeId,
        token: solvedToken,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      $('result').textContent = "Token ter-inject ke stay_cmd.txt:\n" + JSON.stringify(data, null, 2);
      $('result').className = "out ok";
      solvedToken = null;
      setTimeout(refresh, 2000);
    } else {
      $('result').textContent = "Gagal inject: " + JSON.stringify(data);
      $('result').className = "out err";
    }
  } catch (err) {
    $('result').textContent = "Error: " + err;
    $('result').className = "out err";
  }
};

setInterval(refresh, 4000);
refresh();
</script>
</body>
</html>
