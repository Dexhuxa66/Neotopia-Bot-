    <title>Creative Growtopia</title>
      <style>
      html {
        box-sizing: border-box;
      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #444;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
      }
      canvas.emscripten {
        width: 100%;
        height: 100%;
        display: block;
      }

      .logo {
          display: block;
          width: max-width: 100vw;
          height: max-height: 70vh;
          z-index: -1;
      }

      .progress {
          margin: 1.5em;
          border: 1px solid white;
          width: 50vw;
          display: none;
      }
      .progress .full {
          margin: 2px;
          background: white;
          height: 1em;
          transform-origin: top left;
      }

      .loaderStyle {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #loader {
        pointer-events:none;
      }
	  #errortext {
		color: red;
		font-weight: 900;
		font-size: 24;
	  }
	  .overlayBackground {
		position: fixed;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		background: #000;
		opacity: 0.5;
	  }

			.loadingtext {
 				 color: white;
        align-items: center;
        justify-content: center;
		z-index: 99;
      }
      
      .spinner,
      .spinner:after {
        border-radius: 50%;
        width: 5em;
        height: 5em;
      }
      .spinner {
        margin: 10px;
        font-size: 10px;
        position: relative;
        text-indent: -9999em;
        border-top: 1.1em solid rgba(255, 255, 255, 0.2);
        border-right: 1.1em solid rgba(255, 255, 255, 0.2);
        border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
        border-left: 1.1em solid #ffffff;
        transform: translateZ(0);
        animation: spinner-spin 1.1s infinite linear;
        
      }
      @keyframes spinner-spin 
      {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
	  
	.textInputContainer {
		position: fixed;
		left: 0px;
		top: 0px;
		width: 100%;
		height: 100%;
		overflow: hidden;
		z-index: -9999;
	}
	.textInput {
		opacity: 0;
		width: 100%;
		height: 100%;
		padding: 0;
		margin: 0;
		border: 0;
	}
	.startButton {
		z-index: 99;
	}
	#hideAll {
		z-index: 9999;
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
		background-color: #000;
	}
    </style>
  </head>

		<div id="loader" class="loaderStyle">
			<img class="logo" src="WebLoaderData/logo.png">
			<div class="spinner"></div>
			<div class="loadingtext">Setting up...</div>
			
			<div class="progress"><div class="full"></div></div>
		</div>
		<div id="interstitial" class="loaderStyle">

			<br/>
			<div class="loadingtext" id="errortext"></div>
			<br/>
			<div class="loadingtext">You will need to rotate the device to landscape mode. Once you've done that:</div>
			<br/>
			<button class="startButton" onclick="dismissInterstitial()">Start Creative Growtopia!</button>
		</div>
		<div id="enterFullScreenPopup" class="loaderStyle">
			<div class="overlayBackground"></div>
			<div class="loadingtext" id="errortext">Please ensure your device is in landscape mode, then enter fullscreen mode.</div>
			<br/>
			<button class="startButton" onclick="enterFullscreenMode()">Enter full-screen mode</button>
		</div>
		<div id="gameContainer">
			<div class="textInputContainer">
				<input class="textInput" id="textInput" type="text" enterkeyhint="done"
					   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" /> <!-- aria-hidden="true"/> -->
			</div>
			<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
		</div>
		<div id="hideAll"></div>
